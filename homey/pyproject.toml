[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homey"
version = "0.1.0"
description = "Authenticated Athom Homey control nodes for Noxus"
authors = [
    { name = "Noxus Team" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "noxus-sdk>=0.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["homey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
